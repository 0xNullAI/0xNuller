# Keep the production script name so its secret and custom domain remain attached.
name = "dg-llm-proxy"
# 钉住账号，避免同一登录下多账号时部署到错误账号。
account_id = "9c36f42d1cb5ba53e644de21a014d028"
main = "src/index.js"
compatibility_date = "2026-08-09"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# 平台模型的稳定入口由源码管理，部署可从仓库完整重建。
[[routes]]
pattern = "llm.0xnullai.com"
custom_domain = true

[[services]]
binding = "AUTH"
service = "0xnullai-auth"
entrypoint = "AuthOwnershipService"

# `llm.0xnullai.com` is the stable public endpoint used by Web and Android.

[observability]
enabled = true
head_sampling_rate = 1

[vars]

# Secrets (Cloudflare only, never in this file): AI_PRICE_TABLE, VOLC_ARK_API_KEY.
# Without both, managed requests return 503 before any Credit is held.

# Browser origins. Native shells use Bearer sessions and do not send Origin.
ALLOWED_ORIGINS = "https://0xnullai.com,https://www.0xnullai.com,http://tauri.localhost"

# Paid upstream traffic fails closed when a limiter is unavailable.
# Strict limit per signed-in account (or group payer), applied once Auth has named it. It keeps
# the limit the per-IP key used to have; only the key changed.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Loose per-IP bound before the account is known. Chinese carriers put many users behind one
# carrier-grade NAT address, so this only stops a single source from flooding Auth.
[[unsafe.bindings]]
name = "IP_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
