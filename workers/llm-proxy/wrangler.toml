# Keep the production script name so its secret and custom domain remain attached.
name = "dg-llm-proxy"
# 钉住账号，避免同一登录下多账号时部署到错误账号。
account_id = "9c36f42d1cb5ba53e644de21a014d028"
main = "src/index.js"
compatibility_date = "2026-08-09"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

# 平台模型的稳定入口由源码管理，部署可从仓库完整重建。
[[routes]]
pattern = "llm.0xnullai.com"
custom_domain = true

[[services]]
binding = "AUTH"
service = "0xnullai-auth"
entrypoint = "AuthOwnershipService"

[secrets]
required = ["PROXY_API_KEY"]

# `llm.0xnullai.com` is the stable public endpoint used by Web and Android.

[observability]
enabled = true
head_sampling_rate = 1

[vars]
UPSTREAM_BASE_URL = "https://aihub.071129.xyz/v1"
UPSTREAM_MODEL = "openai/gpt-4.1-mini"
INPUT_CREDITS_PER_MILLION = 600
CACHED_INPUT_CREDITS_PER_MILLION = 150
OUTPUT_CREDITS_PER_MILLION = 2400

# Browser origins. Native shells use Bearer sessions and do not send Origin.
ALLOWED_ORIGINS = "https://0xnullai.com,https://www.0xnullai.com,http://tauri.localhost,https://tauri.localhost,tauri://localhost"

# Paid upstream traffic fails closed when the global limiter is unavailable.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Secret: wrangler secret put PROXY_API_KEY
