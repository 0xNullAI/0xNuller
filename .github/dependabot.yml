version: 2
# DG-Wiki uses a low-maintenance single-branch model. Monthly cadence is
# enough — security updates are still surfaced as soon as advisories drop.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
      day: 1
      time: '09:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'type:chore'
      - 'area:deps'
    # Skip major bumps; close them by hand if you really want them
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      day: 1
      time: '09:00'
      timezone: 'Asia/Shanghai'
    commit-message:
      prefix: 'chore(ci)'
    labels:
      - 'type:ci'
      - 'area:deps'
