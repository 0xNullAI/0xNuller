name: Release Guard

# Runs on every PR that targets `main`. Product-code changes must increase the
# platform version. Repository automation and documentation may land without a
# product bump, but still have to pass the shared metadata verifier.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  version-bump-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'

      - name: Verify release metadata and version increases
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          if git diff --quiet origin/main...HEAD -- \
            package.json package-lock.json android apps packages workers; then
            node scripts/verify-release.mjs | tee release-guard.txt
            echo "No product-code changes; version increase is not required." | tee -a release-guard.txt
          else
            node scripts/verify-release.mjs --base=origin/main | tee release-guard.txt
          fi
          {
            echo "## Release guard passed"
            echo ""
            echo '```text'
            cat release-guard.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
