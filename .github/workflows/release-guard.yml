name: Release Guard

# Runs on every PR that targets `main`. main is reserved for production promotion,
# so a PR landing there MUST increase the Product, DG-Kit, or DG-MCP version. The verifier also
# rejects product-version drift between npm, Cargo, Tauri and Android's versionCode.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  version-bump-check:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the release source
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          test "$HEAD_REF" = "dev" || {
            echo "Platform releases must be a dev → main PR; got $HEAD_REF → main" >&2
            exit 1
          }

      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'

      - name: Require npm version preparation to be consumed
        run: npm run verify:changesets:consumed

      - name: Verify release metadata and non-decreasing versions
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          node scripts/verify-release.mjs --base=origin/main | tee release-guard.txt
          {
            echo "## Release guard passed"
            echo ""
            echo '```text'
            cat release-guard.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
