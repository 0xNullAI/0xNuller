name: CI · Product

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/dev' }}
        run: node scripts/detect-domain-changes.mjs product "$BASE_SHA"

  product:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - name: Prepare DG-Kit once
        run: npm run build:kit
      - run: npm run verify:release
      - run: npm run verify:brand
      - run: npm run check:routes
      - name: Typecheck Product against prepared Kit
        run: node scripts/run-workspace-domain.mjs typecheck product
      - name: Test affected Product projects on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run test:affected -- --base="$BASE_SHA" --domain=product --prepared
      - name: Test the full Product domain on protected branches
        if: github.event_name != 'pull_request'
        run: npm run test:product:prepared
      - name: Build Web against prepared Kit
        run: npm run build -w @0xnullai/web

  product-gate:
    if: always()
    needs: [changes, product]
    runs-on: ubuntu-latest
    steps:
      - name: Require affected Product checks
        env:
          CHANGED: ${{ needs.changes.outputs.changed }}
          RESULT: ${{ needs.product.result }}
        run: |
          if [ "$CHANGED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi
