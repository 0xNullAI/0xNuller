name: Tag platform source

# After a verified release lands on main, push the immutable source tag
# v<version>. This workflow intentionally does NOT create a GitHub Release:
# Android Release owns the one user-facing 0xNuller Release and its APK.
# Idempotent: an existing source tag is skipped.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the verified main commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'

      - name: Verify release metadata
        run: node scripts/verify-release.mjs

      - name: Read version
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create tag (if absent)
        env:
          GIT_COMMITTER_NAME: 0xNull
          GIT_COMMITTER_EMAIL: 271426072+0xNullAI@users.noreply.github.com
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            echo "::notice::Tag $tag already exists, skipping."
            exit 0
          fi
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Summary
        run: |
          {
            echo "## Source tagged \`${{ steps.version.outputs.tag }}\`"
            echo ""
            echo "Source: https://github.com/${GITHUB_REPOSITORY}/tree/${{ steps.version.outputs.tag }}"
            echo "User-facing Release and APK are owned by android-release.yml."
          } >> "$GITHUB_STEP_SUMMARY"
