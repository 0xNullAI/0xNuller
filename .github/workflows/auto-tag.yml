name: Auto-tag main

# After a release lands on main, push a git tag matching package.json's
# version AND publish a GitHub Release for it (so the repo's homepage
# shows the "Latest" badge and listings are visible under /releases).
# Idempotent: existing tag/release is skipped.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the verified main commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'

      - name: Verify release metadata
        run: node scripts/verify-release.mjs

      - name: Read version
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          tag="v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create tag (if absent)
        env:
          GIT_COMMITTER_NAME: 0xNull
          GIT_COMMITTER_EMAIL: 271426072+0xNullAI@users.noreply.github.com
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            echo "::notice::Tag $tag already exists, skipping."
            exit 0
          fi
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Create GitHub Release (if absent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $tag already exists, skipping."
            exit 0
          fi
          # Pull commit messages since the previous tag for the release notes.
          prev=$(git tag --sort=-creatordate | grep -v "^$tag$" | { head -1; cat >/dev/null; } || true)
          if [ -n "$prev" ]; then
            notes=$(git log --pretty=format:'- %s' "$prev..HEAD")
            range="$prev → $tag"
          else
            notes=$(git log -n 20 --pretty=format:'- %s')
            range="initial → $tag"
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "$(printf 'Released from \`main\` via auto-tag.yml.\n\n## Changes (%s)\n\n%s\n' "$range" "$notes")" \
            --latest

      - name: Summary
        run: |
          {
            echo "## 🏷️ Tagged \`${{ steps.version.outputs.tag }}\`"
            echo ""
            echo "GitHub Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ steps.version.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
