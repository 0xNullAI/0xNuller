name: CI · Repository

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run check:structure
      - name: Check formatting of changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/dev' }}
        run: npm run format:check:changed -- --base="$BASE_SHA"
      - run: npm run lint
      - run: npm run check:dead-code
      - run: npm run test:repository
