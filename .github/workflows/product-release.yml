name: Release · 0xNuller

# Web and Android are one product release, built from the exact verified main commit and sharing
# the root product version. Every release publishes the Android UI as a signed hot-update bundle;
# an APK (and the GitHub Release that carries it) is built only when the native layer changed
# since the last APK, or on request. npm packages are not handled here.

on:
  workflow_dispatch:
    inputs:
      force_apk:
        description: Build and release an APK even if the native layer is unchanged
        type: boolean
        default: false
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-product-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    steps:
      - name: Resolve verified main commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_run ]; then sha="$VERIFIED_SHA"; else sha="$CURRENT_SHA"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0

      - name: Require exact main source and CI
        uses: ./.github/actions/require-main-source
        with:
          source-sha: ${{ steps.source.outputs.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
          cache: npm
      - run: npm install --global npm@11.6.2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - run: npm ci

      - name: Detect new product version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # UI-only releases are tags without a GitHub Release, so the tag is what marks a release.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::猫愿 $version is already released."
          else
            test -f "docs/releases/$version.md" || { echo "Missing docs/releases/$version.md" >&2; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether this release ships an APK
        if: steps.version.outputs.publish == 'true'
        id: native
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_APK: ${{ inputs.force_apk == true }}
        run: |
          # GitHub Releases exist only for APK releases; the latest one is the native baseline.
          last=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          if [ -n "$last" ]; then
            # Fails the release when the native layer changed without a NATIVE_API bump.
            node scripts/native-fingerprint.mjs --against="$last" | tee native.txt
          fi
          if [ "$FORCE_APK" = true ] || [ -z "$last" ] || ! grep -q 'UI-only release' native.txt; then
            apk=true
          else
            apk=false
          fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "::notice::APK baseline ${last:-none}; this release ships an APK: $apk"

      - name: Build production Web
        if: steps.version.outputs.publish == 'true'
        run: npm run web:build:release

      - name: Build Android UI (hot update only)
        if: steps.version.outputs.publish == 'true' && steps.native.outputs.apk != 'true'
        env:
          SOURCE_BUILD_ID: ${{ steps.source.outputs.sha }}
        run: npm run build -w @0xnullai/android

      - name: Restore Android signing keystore
        if: steps.version.outputs.publish == 'true' && steps.native.outputs.apk == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_RELEASE_KEYSTORE_B64' >&2; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dg-agent-release.jks"

      - name: Build signed Android APK
        if: steps.version.outputs.publish == 'true' && steps.native.outputs.apk == 'true'
        env:
          DG_AGENT_KEYSTORE: ${{ runner.temp }}/dg-agent-release.jks
          DG_AGENT_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          DG_AGENT_STORE_PASS: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          DG_AGENT_KEY_PASS: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          npm run android:init
          npm run android:build -- --apk --target aarch64

      - name: Verify and name APK
        if: steps.version.outputs.publish == 'true' && steps.native.outputs.apk == 'true'
        id: apk
        run: |
          apk='android/app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk'
          npm run verify:android:apk -- "$apk" | tee apk-verification.json
          artifact="$RUNNER_TEMP/maoyuan-v${{ steps.version.outputs.version }}.apk"
          install -m 0644 "$apk" "$artifact"
          # Apps up to 6.5.x look for the old asset name; the same APK under it keeps them updating.
          legacy="$RUNNER_TEMP/0xnuller-v${{ steps.version.outputs.version }}.apk"
          install -m 0644 "$apk" "$legacy"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
          echo "legacy=$legacy" >> "$GITHUB_OUTPUT"

      - name: Sign the Android hot-update bundle
        if: steps.version.outputs.publish == 'true'
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          test -n "$OTA_SIGNING_KEY" || { echo 'Missing OTA_SIGNING_KEY' >&2; exit 1; }
          node scripts/ota-bundle.mjs \
            --version="${{ steps.version.outputs.version }}" \
            --build-id="${{ steps.source.outputs.sha }}"

      - name: Reconfirm current main source
        if: steps.version.outputs.publish == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git fetch origin main
          test "$SOURCE_SHA" = "$(git rev-parse origin/main)"

      - name: Require Cloudflare credentials
        if: steps.version.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PROD_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_PROD_DEPLOY_TOKEN' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_PROD_ACCOUNT_ID' >&2; exit 1; }

      - name: Deploy product services and Web
        if: steps.version.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PROD_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PROD_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply 0xnullai-auth --remote --config workers/auth/wrangler.jsonc
          npx wrangler deploy --config workers/auth/wrangler.jsonc
          npx wrangler deploy --config apps/chat/wrangler.jsonc
          npx wrangler deploy --config workers/llm-proxy/wrangler.toml
          npx wrangler deploy --config apps/market/wrangler.jsonc
          npx wrangler deploy --config apps/voice/wrangler.jsonc
          npx wrangler deploy --config apps/web/wrangler.jsonc

      - name: Verify deployed product version
        if: steps.version.outputs.publish == 'true'
        env:
          EXPECTED_PRODUCT_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_BUILD_ID: ${{ steps.source.outputs.sha }}
        run: npm run smoke:production

      - name: Tag the UI-only release
        if: steps.version.outputs.publish == 'true' && steps.native.outputs.apk != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${{ steps.version.outputs.tag }}" \
            -f sha="${{ steps.source.outputs.sha }}" >/dev/null

      - name: Create product GitHub Release
        if: steps.version.outputs.publish == 'true' && steps.native.outputs.apk == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.apk.outputs.path }}" "${{ steps.apk.outputs.legacy }}" \
            --target "${{ steps.source.outputs.sha }}" \
            --title "猫愿 ${{ steps.version.outputs.version }}" \
            --notes-file "docs/releases/${{ steps.version.outputs.version }}.md" \
            --latest

      - name: Summary
        if: steps.version.outputs.publish == 'true'
        run: |
          {
            echo '## 猫愿 product released'
            echo ''
            echo '- Web: https://0xnullai.com'
            echo '- Android UI hot update: https://0xnullai.com/ota/android/latest.json'
            if [ '${{ steps.native.outputs.apk }}' = true ]; then
              echo '- Android: `maoyuan-v${{ steps.version.outputs.version }}.apk`'
              echo '- Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}'
            else
              echo '- Android: UI-only release, no new APK'
            fi
            echo '- Source: `${{ steps.source.outputs.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"
