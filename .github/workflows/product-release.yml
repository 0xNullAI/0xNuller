name: Product Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: product-release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.release.outputs.should-release }}
      version: ${{ steps.release.outputs.version }}
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve the verified main commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            echo "sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'

      - name: Check whether this version is new
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Product Release $tag already exists; no build is needed."
          else
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: prepare
    if: needs.prepare.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing production secret ANDROID_KEYSTORE_BASE64' >&2; exit 1; }
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dg-agent-release.jks"

      - run: npm ci

      - name: Generate Android project
        run: npm run android:init

      - name: Build signed arm64 APK
        env:
          DG_AGENT_KEYSTORE: ${{ runner.temp }}/dg-agent-release.jks
          DG_AGENT_ALIAS: ${{ secrets.DG_AGENT_ALIAS }}
          DG_AGENT_STORE_PASS: ${{ secrets.DG_AGENT_STORE_PASS }}
          DG_AGENT_KEY_PASS: ${{ secrets.DG_AGENT_KEY_PASS }}
        run: npm run android:build -- --apk --target aarch64

      - name: Verify signed APK
        id: apk
        run: |
          set -euo pipefail
          apk='android/app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk'
          npm run verify:android:apk -- "$apk" | tee apk-verification.json
          version=$(node -p "require('./package.json').version")
          artifact="$RUNNER_TEMP/0xnuller-v$version.apk"
          install -m 0644 "$apk" "$artifact"
          echo "path=$artifact" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create unified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.apk.outputs.path }}
          TAG: ${{ steps.apk.outputs.tag }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace a signed artifact." >&2
            exit 1
          fi
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.prepare.outputs.source-sha }}" \
            --title "0xNuller $VERSION" \
            --notes-file "docs/releases/$VERSION.md" \
            --latest

      - name: Summary
        run: |
          {
            echo '## Product release published'
            echo ''
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ steps.apk.outputs.tag }}"
            echo ''
            echo '```json'
            cat apk-verification.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
