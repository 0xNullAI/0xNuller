name: CI · DG-MCP

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/detect-domain-changes.mjs mcp "$BASE_SHA"

  mcp:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run verify:mcp
      - run: npm run typecheck:mcp
      - run: node scripts/run-vitest.mjs run --project=dg-mcp

  mcp-gate:
    if: always()
    needs: [changes, mcp]
    runs-on: ubuntu-latest
    steps:
      - name: Require affected DG-MCP checks
        env:
          CHANGED: ${{ needs.changes.outputs.changed }}
          RESULT: ${{ needs.mcp.result }}
        run: |
          if [ "$CHANGED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi
