name: CI · DG-MCP

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/dev' }}
        run: node scripts/detect-domain-changes.mjs mcp "$BASE_SHA"

  mcp:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run verify:mcp
      - name: Typecheck DG-MCP against prepared Kit
        run: node scripts/run-workspace-domain.mjs typecheck mcp
      - name: Test affected DG-MCP projects on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run test:affected -- --base="$BASE_SHA" --domain=mcp --prepared
      - name: Test the full DG-MCP domain on protected branches
        if: github.event_name != 'pull_request'
        run: npm run test:mcp:prepared

  mcp-gate:
    if: always()
    needs: [changes, mcp]
    runs-on: ubuntu-latest
    steps:
      - name: Require affected DG-MCP checks
        env:
          CHANGED: ${{ needs.changes.outputs.changed }}
          RESULT: ${{ needs.mcp.result }}
        run: |
          if [ "$CHANGED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi
