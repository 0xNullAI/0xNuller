name: Publish · DG-MCP

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI · DG-MCP]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: publish-dg-mcp-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - name: Resolve verified main commit
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_run ]; then sha="$VERIFIED_SHA"; else sha="$CURRENT_SHA"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
      - name: Require exact main source and repository CI
        uses: ./.github/actions/require-main-source
        with:
          source-sha: ${{ steps.source.outputs.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          required-workflow: ci-mcp.yml
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run verify:changesets:consumed
      - run: npm run verify:mcp
      - name: Wait for the current DG-Kit dependencies on npm
        run: |
          set -euo pipefail
          mapfile -t dependencies < <(
            node -e "const p=require('./apps/mcp/package.json'); console.log(Object.keys(p.dependencies).filter((name) => name.startsWith('@dg-kit/')).join('\\n'))"
          )
          for name in "${dependencies[@]}"; do
            package=${name#@dg-kit/}
            version=$(node -p "require('./packages/kit/$package/package.json').version")
            range=$(node -p "require('./apps/mcp/package.json').dependencies['$name']")
            available=false
            for attempt in $(seq 1 40); do
              if npm view "$name@$version" version >/dev/null 2>&1; then
                available=true
                break
              fi
              echo "Waiting for $name@$version on npm ($attempt/40)"
              sleep 15
            done
            test "$available" = true || {
              echo "$name@$version is not available on npm" >&2
              exit 1
            }
            versions=$(npm view "$name@$range" version --json)
            node -e "const v=JSON.parse(process.argv[1]); if (!(Array.isArray(v) ? v : [v]).includes(process.argv[2])) process.exit(1)" "$versions" "$version" || {
              echo "$name range $range does not include current version $version" >&2
              exit 1
            }
          done
      - name: Reconfirm current main source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git fetch origin main
          test "$SOURCE_SHA" = "$(git rev-parse origin/main)"
      - name: Publish DG-MCP when its version changed
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          version=$(node -p "require('./apps/mcp/package.json').version")
          if npm view "dg-mcp@$version" version >/dev/null 2>&1; then
            echo "dg-mcp@$version already published"
          else
            npm publish --workspace dg-mcp --access public --provenance
          fi
