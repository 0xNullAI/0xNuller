name: NPM Version Preparation

# dev may prepare package manifests and changelogs, but it never publishes artifacts.
# DG-Kit and DG-MCP remain independent versions inside one Changesets Version PR.

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['.changeset/**']

concurrency:
  group: kit-version-dev
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run verify:packages
      - id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          commit: 'chore: version npm packages'
          title: 'chore: prepare npm package versions'
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 0xNull
          GIT_AUTHOR_EMAIL: 271426072+0xNullAI@users.noreply.github.com
          GIT_COMMITTER_NAME: 0xNull
          GIT_COMMITTER_EMAIL: 271426072+0xNullAI@users.noreply.github.com
      - name: Run CI for the generated Version PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --ref changeset-release/dev
