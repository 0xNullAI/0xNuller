name: CI · DG-Kit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/dev' }}
        run: node scripts/detect-domain-changes.mjs kit "$BASE_SHA"

  kit:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run verify:kit
      - run: npm run typecheck:kit
      - name: Test affected Kit projects on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run test:affected -- --base="$BASE_SHA" --domain=kit --prepared
      - name: Test the full Kit domain on protected branches
        if: github.event_name != 'pull_request'
        run: npm run test:kit:prepared

  kit-gate:
    if: always()
    needs: [changes, kit]
    runs-on: ubuntu-latest
    steps:
      - name: Require affected DG-Kit checks
        env:
          CHANGED: ${{ needs.changes.outputs.changed }}
          RESULT: ${{ needs.kit.result }}
        run: |
          if [ "$CHANGED" = true ]; then test "$RESULT" = success; else test "$RESULT" = skipped; fi
