name: Release

# `@dg-kit/*` 与 `dg-mcp` 的独立 npm 发布链路。
#
#   push dev（有 changeset）→ 开/更新 "release npm packages" PR
#   push dev（Version PR 已合并）→ 发布版本化后的包到 npm
#
# npm 包和 0xNuller 产品使用不同的版本线。main 只负责产品、网页与 APK，绝不在
# main 上再创建一份 changeset-release 分支。

on:
  workflow_dispatch:
  push:
    branches: [dev]

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build:kit
      - run: npm run verify:packages
      - id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: 'chore: release npm packages'
          title: 'chore: release npm packages'
          setupGitUser: false
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 0xNull
          GIT_AUTHOR_EMAIL: 271426072+0xNullAI@users.noreply.github.com
          GIT_COMMITTER_NAME: 0xNull
          GIT_COMMITTER_EMAIL: 271426072+0xNullAI@users.noreply.github.com
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance 用 workflow 的短期 OIDC 身份签名发布产物，消费者可以
          # 验证包确实由这个 commit 构建。https://docs.npmjs.com/generating-provenance-statements
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Release summary
        if: steps.changesets.outputs.published == 'true'
        run: |
          {
            echo "## ✅ Released to npm"
            echo ""
            echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | "- \(.name)@\(.version) → https://www.npmjs.com/package/\(.name)/v/\(.version)"'
          } >> "$GITHUB_STEP_SUMMARY"
