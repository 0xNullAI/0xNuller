name: Release

# `@dg-kit/*` 的发布链路。
#
#   push dev  → changesets 消费 .changeset/*.md，开/更新 "Version Packages" PR
#   push main → 已无 pending changeset，执行 changeset publish 推到 npm
#
# 合并前 DG-Kit 的这份配置在 dev 和 main 上都带 `publish:` 参数：真正的发布发生在
# push dev 时，等 sync 到 main 再跑一次，版本全都已在 registry 上，必然 E409 标红。
# 这里拆成两个 job 并用 `if` 按分支分工，红叉不再是"正常现象"。

on:
  # 迁移期间只允许手动触发。旧的 DG-Kit 仓库仍然在线且它的 release.yml 依然武装，
  # 两个仓库同时具备发布 @dg-kit/* 的能力会直接撞车。等 npm 发布正式切到本仓、
  # 旧仓下线之后，恢复下面被注释掉的 push 触发。
  workflow_dispatch:
  # push:
  #   branches: [dev, main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # dev：只开 Version PR，不发布
  version:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:kit
      - run: npm run verify:packages
      - uses: changesets/action@v1
        with:
          version: npm run version
          commit: 'chore: release @dg-kit/*'
          title: 'chore: release @dg-kit/*'
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 0xNull
          GIT_AUTHOR_EMAIL: 271426072+0xNullAI@users.noreply.github.com
          GIT_COMMITTER_NAME: 0xNull
          GIT_COMMITTER_EMAIL: 271426072+0xNullAI@users.noreply.github.com

  # main：只发布，不开 PR
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build:kit
      - run: npm run verify:packages
      - name: Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: 0xNull
          GIT_AUTHOR_EMAIL: 271426072+0xNullAI@users.noreply.github.com
          GIT_COMMITTER_NAME: 0xNull
          GIT_COMMITTER_EMAIL: 271426072+0xNullAI@users.noreply.github.com
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance 用 workflow 的短期 OIDC 身份签名发布产物，消费者可以
          # 验证包确实由这个 commit 构建。https://docs.npmjs.com/generating-provenance-statements
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Release summary
        if: steps.changesets.outputs.published == 'true'
        run: |
          {
            echo "## ✅ Released to npm"
            echo ""
            echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | "- \(.name)@\(.version) → https://www.npmjs.com/package/\(.name)/v/\(.version)"'
          } >> "$GITHUB_STEP_SUMMARY"
