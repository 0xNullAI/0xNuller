name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    outputs:
      product: ${{ steps.changes.outputs.product }}
      desktop: ${{ steps.changes.outputs.desktop }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci

      - name: Detect affected release domains
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          for domain in product desktop kit mcp; do
            changed=$(node scripts/detect-domain-changes.mjs "$domain" "$BASE_SHA" | sed -n 's/^changed=//p')
            echo "$domain=$changed" >> "$GITHUB_OUTPUT"
          done

      - run: npm run check:structure
      - name: Check formatting of changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: npm run format:check:changed -- --base="$BASE_SHA"
      - run: npm run lint
      - run: npm run check:dead-code
      - name: Build shared Kit once
        run: npm run build:kit
      - name: Verify Product metadata
        if: steps.changes.outputs.product == 'true'
        run: npm run verify:release && npm run verify:brand && npm run check:routes
      - name: Typecheck Product
        if: steps.changes.outputs.product == 'true'
        run: node scripts/run-workspace-domain.mjs typecheck product
      - name: Build Web
        if: steps.changes.outputs.product == 'true'
        run: npm run build -w @0xnullai/web

      - name: Verify DG-Kit
        if: steps.changes.outputs.kit == 'true'
        run: node scripts/verify-publish-packages.mjs --scope=kit && npm run typecheck:kit
      - name: Verify DG-MCP
        if: steps.changes.outputs.mcp == 'true'
        run: npm run build -w dg-mcp && node scripts/verify-publish-packages.mjs --scope=mcp
      - name: Typecheck DG-MCP
        if: steps.changes.outputs.mcp == 'true'
        run: node scripts/run-workspace-domain.mjs typecheck mcp
      - name: Test affected projects
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run test:affected -- --base="$BASE_SHA" --prepared
      - name: Test repository
        if: github.event_name != 'pull_request'
        run: npm run test:full:prepared

  desktop:
    needs: checks
    if: needs.checks.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.19.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS arm64 targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run build:kit
      - run: npm run typecheck -w @0xnullai/android
      - run: npm run build -w @0xnullai/android
      - run: cargo test --locked --manifest-path android/app/src-tauri/Cargo.toml
      - name: Build desktop installer
        run: npm run desktop:build -w @0xnullai/android -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: 0xnuller-${{ matrix.artifact }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/src-tauri/target/**/bundle/dmg/*.dmg
            android/app/src-tauri/target/**/bundle/nsis/*.exe

  desktop-gate:
    name: desktop-gate
    if: always()
    needs: [checks, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Require requested desktop builds
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          DESKTOP_REQUIRED: ${{ needs.checks.outputs.desktop }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          test "$CHECKS_RESULT" = success
          if [ "$DESKTOP_REQUIRED" = true ]; then
            test "$DESKTOP_RESULT" = success
          else
            test "$DESKTOP_RESULT" = skipped
          fi
