name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '26.11.1'
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci

      - name: Detect affected release domains
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          for domain in product kit mcp; do
            changed=$(node scripts/detect-domain-changes.mjs "$domain" "$BASE_SHA" | sed -n 's/^changed=//p')
            echo "$domain=$changed" >> "$GITHUB_OUTPUT"
          done

      - run: npm run check:structure
      - name: Check formatting of changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: npm run format:check:changed -- --base="$BASE_SHA"
      - run: npm run lint
      - run: npm run check:dead-code
      - name: Build shared Kit once
        run: npm run build:kit
      - name: Verify Product metadata
        if: steps.changes.outputs.product == 'true'
        run: npm run verify:release && npm run verify:brand && npm run check:routes
      - name: Typecheck Product
        if: steps.changes.outputs.product == 'true'
        run: node scripts/run-workspace-domain.mjs typecheck product
      - name: Build Web
        if: steps.changes.outputs.product == 'true'
        run: npm run build -w @0xnullai/web

      - name: Verify DG-Kit
        if: steps.changes.outputs.kit == 'true'
        run: node scripts/verify-publish-packages.mjs --scope=kit && npm run typecheck:kit
      - name: Verify DG-MCP
        if: steps.changes.outputs.mcp == 'true'
        run: npm run build -w dg-mcp && node scripts/verify-publish-packages.mjs --scope=mcp
      - name: Typecheck DG-MCP
        if: steps.changes.outputs.mcp == 'true'
        run: node scripts/run-workspace-domain.mjs typecheck mcp
      - name: Test affected projects
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run test:affected -- --base="$BASE_SHA" --prepared
      - name: Test repository
        if: github.event_name != 'pull_request'
        run: npm run test:full:prepared

  android-native:
    # The hot-update store decides what code installed apps run, so its tests gate every change
    # to the native layer.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect native changes
        id: native
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if git diff --quiet "$BASE_SHA" HEAD -- android/app/src-tauri 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Tauri host dependencies
        if: steps.native.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        if: steps.native.outputs.changed == 'true'
      - name: Test the native layer
        if: steps.native.outputs.changed == 'true'
        run: |
          # generate_context! embeds the UI at compile time; the tests only need a placeholder.
          mkdir -p android/app/dist
          test -f android/app/dist/index.html || echo '<!doctype html><html></html>' > android/app/dist/index.html
          cargo test --locked --manifest-path android/app/src-tauri/Cargo.toml
