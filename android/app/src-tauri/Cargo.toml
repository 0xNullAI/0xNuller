[package]
name = "nuller-app"
version = "6.3.0"
description = "0xNuller unified Android shell"
authors = ["0xNullAI"]
license = "MIT"
repository = "https://github.com/0xNullAI/0xNuller"
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# The backend ships in the APK, but product initialization remains gated by the separate
# default-off local experimental setting and an explicit human scan action.
default = ["experimental-buttplug-gate0"]
experimental-buttplug-gate0 = [
  "dep:btleplug",
  "dep:buttplug_client",
  "dep:buttplug_client_in_process",
  "dep:buttplug_core",
  "dep:buttplug_server",
  "dep:buttplug_server_device_config",
  "dep:buttplug_server_hwmgr_btleplug",
  "dep:futures",
  "dep:tokio",
  "dep:uuid",
]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
buttplug_client = { version = "=10.0.3", default-features = false, features = ["tokio-runtime"], optional = true }
buttplug_client_in_process = { version = "=10.0.3", default-features = false, features = ["tokio-runtime", "btleplug-manager"], optional = true }
buttplug_core = { version = "=10.0.3", default-features = false, optional = true }
# These exact constraints also prevent buttplug_client_in_process's caret
# dependencies from drifting to a mixed Gate 0 stack.
buttplug_server = { version = "=10.0.3", default-features = false, optional = true }
buttplug_server_device_config = { version = "=10.1.0", optional = true }
buttplug_server_hwmgr_btleplug = { version = "=10.0.3", optional = true }
futures = { version = "=0.3.32", optional = true }
tokio = { version = "=1.52.1", features = ["sync", "time"], optional = true }
uuid = { version = "=1.23.1", features = ["v4"], optional = true }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# Pinned to the multi-device fork (0xNullAI/tauri-plugin-blec-multi) instead
# of upstream crates.io — upstream tauri-plugin-blec only tracks a single
# BLE connection at a time. Must stay in lockstep with the JS side's
# @mnlphlp/plugin-blec dependency (@dg-kit/transport-tauri-blec's
# package.json points at the same fork via a git URL, for the same reason:
# the JS bindings now pass an `address` parameter the upstream 0.4 Rust
# plugin doesn't understand). Interim measure until the fork is published to
# crates.io or upstreamed.
tauri-plugin-blec = { git = "https://github.com/0xNullAI/tauri-plugin-blec-multi.git", rev = "4db7f46" }

[target.'cfg(target_os = "android")'.dependencies]
btleplug = { version = "=0.12.0", optional = true }
# Must match btleplug 0.12's Android ABI-facing JNI dependency.
jni = "=0.19.0"
