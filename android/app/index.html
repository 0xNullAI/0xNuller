<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <title>0xNuller</title>
  </head>
  <body>
    <style>
      /* Splash shown while React mounts. After React commits, main.tsx adds
         the .nx-splash-loaded class which fades it out before removal.
         Only the splash overlay is dark — body styling is intentionally left
         to apps/web's theme tokens so light/dark mode stay in control. */
      html,
      body {
        margin: 0;
      }
      #nx-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080808;
        transition: opacity 200ms ease-out;
      }
      #nx-splash.nx-splash-loaded {
        opacity: 0;
        pointer-events: none;
      }
      #nx-splash svg {
        width: 96px;
        height: 96px;
      }
      #nx-splash path {
        stroke-dasharray: 80;
        animation: nx-pulse 1.4s ease-in-out infinite;
      }
      @keyframes nx-pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
    <div id="root"></div>
    <div id="nx-splash" aria-hidden="true">
      <svg viewBox="0 0 40 40">
        <rect x="2" y="2" width="36" height="36" rx="10" fill="#080808" stroke="#ffe28a" />
        <path
          d="M7 20h6l3-7 6 14 6-14 4 7h2"
          stroke="#ffe28a"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
