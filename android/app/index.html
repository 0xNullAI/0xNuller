<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>猫愿</title>
    <meta name="theme-color" content="#080808" />
    <script>
      // First paint matches the theme store: a saved choice wins, otherwise dark.
      (function () {
        var dark = true;
        try {
          var mode = localStorage.getItem('0xnullai.theme');
          if (mode === 'light') dark = false;
          if (mode === 'auto') dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {
          /* keep dark */
        }
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        root.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#080808' : '#ffffff';
      })();
    </script>
  </head>
  <body>
    <style>
      /* Splash shown while React mounts. After React commits, main.tsx adds
         the .nx-splash-loaded class which fades it out before removal.
         Only the splash overlay is dark — body styling is intentionally left
         to apps/web's theme tokens so light/dark mode stay in control. */
      html,
      body {
        margin: 0;
      }
      #nx-splash {
        position: fixed;
        inset: 0;
        z-index: var(--z-splash, 1100);
        display: flex;
        align-items: center;
        justify-content: center;
        background: #080808;
        transition: opacity 200ms ease-out;
      }
      #nx-splash.nx-splash-loaded {
        opacity: 0;
        pointer-events: none;
      }
      #nx-splash svg {
        width: 96px;
        height: 96px;
      }
      #nx-splash path {
        animation: nx-pulse 1.4s ease-in-out infinite;
      }
      @keyframes nx-pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
    <div id="root"></div>
    <div id="nx-splash" aria-hidden="true">
      <svg viewBox="0 0 40 40">
        <path
          transform="matrix(0.0054 0 0 -0.0054 -14.9745 53.8917)"
          fill="#ffe28a"
          d="M8135 9376 c-124 -98 -595 -669 -774 -936 -218 -326 -277 -521 -296 -980 -15 -360 -84 -565 -317 -951 -192 -317 -327 -486 -663 -829 -264 -269 -371 -395 -502 -593 -158 -238 -257 -453 -321 -696 -35 -135 -36 -137 -36 -354 -1 -176 -4 -216 -14 -212 -49 19 -214 147 -302 235 -497 497 -622 1284 -309 1940 114 238 216 376 579 780 283 315 391 503 420 732 53 433 -314 867 -807 953 -326 57 -577 -68 -539 -268 11 -57 75 -118 213 -203 262 -162 358 -318 324 -525 -29 -179 -95 -291 -459 -786 -485 -659 -619 -1280 -425 -1968 224 -799 863 -1415 1632 -1573 125 -25 2251 -30 2300 -5 103 53 109 198 14 304 -86 95 -198 129 -425 129 l-158 0 57 69 c172 204 250 451 240 751 -11 320 -98 528 -312 747 -61 62 -109 113 -107 113 23 0 139 -38 184 -60 264 -131 378 -344 453 -850 124 -833 219 -1099 424 -1194 42 -19 66 -21 276 -24 146 -2 243 0 267 7 78 24 121 113 98 202 -25 97 -87 153 -224 205 -84 32 -146 72 -180 117 -121 162 -191 533 -167 893 19 287 56 420 206 736 154 323 194 471 182 667 -12 181 -67 319 -207 521 -250 361 -278 411 -287 508 -7 75 22 146 82 201 79 73 158 101 352 126 218 28 301 74 415 230 96 131 99 170 19 253 -102 107 -155 208 -191 365 -38 168 -114 282 -248 372 -59 40 -59 40 -30 125 67 196 125 560 89 560 -5 0 -36 -18 -69 -41 -118 -78 -185 -176 -252 -368 l-37 -104 -6 194 c-12 412 -63 564 -162 485z"
        />
      </svg>
    </div>
    <script>
      (function () {
        var supported =
          window.CSS &&
          CSS.supports('color', 'oklch(50% 0.1 180)') &&
          CSS.supports('height', '100dvh') &&
          typeof Object.hasOwn === 'function' &&
          typeof Array.prototype.at === 'function';
        if (!supported) {
          var splash = document.getElementById('nx-splash');
          if (splash) splash.remove();
          document.getElementById('root').innerHTML =
            '<main style="font:16px/1.6 system-ui;padding:32px;max-width:640px;margin:auto"><h1>请更新浏览器或系统 WebView</h1><p>猫愿需要 Chrome / Edge / Android System WebView 111+、Safari 16.4+ 或 Firefox 128+。请更新后重新打开应用。</p><p>Android 系统版本与 WebView 版本不同；可在应用商店更新 Android System WebView。macOS 请更新至 13.3 或更高版本。</p></main>';
          window.__NULLER_UNSUPPORTED__ = true;
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
