name = "dg-market"
main = "src/worker/index.ts"
compatibility_date = "2025-01-01"

# 统一外壳占据根域，本 Worker 只接管市场的 API。静态资源不再由它托管。
[[routes]]
pattern = "0xnullai.com/api/items*"
zone_name = "0xnullai.com"

[[routes]]
pattern = "0xnullai.com/api/admin/*"
zone_name = "0xnullai.com"

# 前端静态资源由 Vite 构建到 ./dist，由 Workers Static Assets 托管。
# run_worker_first 只列 Worker 真正处理的前缀（src/worker/index.ts 只有 /api/*）。
# 设成 true 会让每个静态资源请求都变成计费的 Worker 调用，而免费额度耗尽时
# Cloudflare 返回 429 而不是回退到资源服务，等于整站挂掉。
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker 先行：所有请求进 Worker，非 /api 路径由 Worker 回退到 env.ASSETS。
run_worker_first = ["/api/*"]

# D1 数据库（免费额度：5GB 存储 / 每天 500 万行读 / 10 万行写）。
# database_id 在执行 `wrangler d1 create dg-market` 后填入。
[[d1_databases]]
binding = "DB"
database_name = "dg-market"
database_id = "cf5f0c37-5b39-44f9-ab68-430849f9a4f6"

# 机密用命令设置，勿写进文件：
#   wrangler secret put ADMIN_KEY          # 管理员删除 / 编辑接口的口令
# 说明：已移除 Cloudflare Turnstile 人机验证，上传/批量上传均无需令牌。
